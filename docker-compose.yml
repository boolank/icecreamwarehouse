services:
  postgres:
    image: postgres:16-alpine
    container_name: icecream_wms_db
    restart: always
    environment:
      POSTGRES_DB: icecream_wms_db
      POSTGRES_USER: wms_user
      POSTGRES_PASSWORD: SuperS3cr3tPass!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/00_skema_database_lengkap.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_user -d icecream_wms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: icecream_wms_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:

